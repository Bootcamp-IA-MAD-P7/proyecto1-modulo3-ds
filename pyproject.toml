[project]
name = "f5-riskai"
version = "0.1.0"
description = "ML prototype for stroke risk estimation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "joblib",
    "fastapi",
    "uvicorn",
    "httpx",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"
