# F5 RiskAI — Nginx site configuration for the built Vue SPA.
#
# This file is a TEMPLATE: `${NGINX_PORT}` is substituted at container start
# by docker/frontend-entrypoint.sh via `envsubst`. The port honours the
# `PORT` variable injected by Render for web services (default 10000 there);
# local Docker Compose does not set it, so `PORT` falls back to 80 and the
# existing compose layout (frontend on 8080:80) is unchanged.
server {
    listen ${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Render health check (no logs, instant 200 answer).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Static assets: cache aggressively (hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any route that is not a real file goes to index.html
    # so vue-router can resolve it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose the Nginx version.
    server_tokens off;
}