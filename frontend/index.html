<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="F5 RiskAI - AI Stroke Risk Assessment prototype"
    />
    <title>F5 RiskAI - AI Stroke Risk Assessment</title>
    <script>
      // Apply persisted theme + language before CSS paint to avoid a flash.
      ;(function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('f5-riskai-theme') || 'light'
          var lang = localStorage.getItem('f5-riskai-language') || 'es'
          root.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light')
          root.setAttribute('lang', lang === 'en' ? 'en' : 'es')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
